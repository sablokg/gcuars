[package]
name = "gcua"
version = "0.1.0"
edition = "2021"
description = "GCUA: General Codon Usage Analysis (Rust port of the core analysis engine)"
authors = ["Rust port"]

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
once_cell = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kuva = "0.5"

[profile.release]
opt-level = 3
lto = true
